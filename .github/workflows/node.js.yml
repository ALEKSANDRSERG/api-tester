name: Build and deploy project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Build_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: $GITHUB_WORKSPACE/frontend
    steps:
    - run: npm ci
    - run: npm run build --if-present
