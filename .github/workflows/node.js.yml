name: Build and deploy project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Build_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    - name: setup node version to 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        
    - run: npm ci
    - run: npm run build --if-present
